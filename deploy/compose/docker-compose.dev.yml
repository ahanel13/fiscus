# Dependencies for local development (`pnpm dev` runs the apps on the host).
#   docker compose -f deploy/compose/docker-compose.dev.yml up -d
# Ports are bound to localhost only. Credentials are fixed, dev-only values.
name: fiscus-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fiscus
      POSTGRES_USER: fiscus_owner
      POSTGRES_PASSWORD: fiscus-dev-owner
    ports: ['127.0.0.1:5432:5432']
    volumes: [dev-db:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiscus_owner -d fiscus']
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9-alpine
    ports: ['127.0.0.1:6379:6379']

  # Catches outgoing email (invites, notifications): UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']

  # S3-compatible storage for receipts (SeaweedFS; MinIO no longer publishes community images).
  # S3 API on http://localhost:8333 with the credentials below.
  s3:
    image: chrislusf/seaweedfs:4.47
    command: ['server', '-dir=/data', '-s3', '-s3.config=/etc/seaweedfs/s3.json']
    ports: ['127.0.0.1:8333:8333']
    volumes:
      - dev-s3:/data
      - ./dev-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  dev-db:
  dev-s3:
