# For tests only, never a real install: a fake Plaid for the end-to-end tests (#79, D17), so they
# connect a bank with no Plaid account and no secrets. Layer it on the main file:
#   docker compose -f deploy/compose/docker-compose.yml \
#     -f deploy/compose/docker-compose.plaid-stub.yml up -d --build --wait
#
# The api and worker get sandbox keys that only the stub accepts, and PLAID_API_BASE_URL, which
# the api honors only in sandbox, sends their Plaid calls to it. Plaid Link itself (the browser's
# side) is stubbed by the tests (apps/web/e2e/plaid-link.ts), at Plaid's real script URL.

x-plaid-stub-env: &plaid-stub-env
  PLAID_CLIENT_ID: fake-client-id-rivera
  PLAID_SECRET: fake-sandbox-secret-rivera
  PLAID_ENV: sandbox
  PLAID_API_BASE_URL: http://plaid-stub:4010

services:
  plaid-stub:
    # The api image carries the fake (@fiscus/aggregation's test helpers); this runs it alone.
    image: ghcr.io/ahanel13/fiscus-api:${FISCUS_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ['node', 'node_modules/@fiscus/aggregation/dist/testing/plaid-stub.js']
    restart: 'no'
    environment:
      PLAID_STUB_PORT: '4010'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4010/').then(() => process.exit(0), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    environment: *plaid-stub-env
    depends_on:
      plaid-stub:
        condition: service_healthy

  worker:
    environment: *plaid-stub-env
    depends_on:
      plaid-stub:
        condition: service_healthy
