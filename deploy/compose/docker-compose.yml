# Fiscus all-in-one stack. Usage:
#   cp deploy/compose/.env.example deploy/compose/.env   # then set the passwords
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
# Then open http://localhost:8080 (or FISCUS_PORT).
#
# Every service is configured only through environment variables, so the same images can be
# split across hosts (e.g. Proxmox LXCs) by pointing the URLs at other machines (ADR 0003).
name: fiscus

x-images: &build-args
  context: ../..

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fiscus
      POSTGRES_USER: fiscus_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18+ images store data under /var/lib/postgresql/<major>/; mount the parent so
      # future major upgrades (pg_upgrade) can see both versions.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiscus_owner -d fiscus']
      interval: 5s
      timeout: 3s
      retries: 20

  # Job queues and caching (used from M2 on). Holds no durable data.
  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations as the owner and enables the fiscus_app and fiscus_worker logins.
  migrate:
    image: ghcr.io/ahanel13/fiscus-api:${FISCUS_VERSION:-latest}
    build:
      <<: *build-args
      dockerfile: apps/api/Dockerfile
    command: ['node_modules/.bin/fiscus-migrate']
    restart: 'no'
    environment:
      MIGRATION_DATABASE_URL: postgres://fiscus_owner:${POSTGRES_PASSWORD}@db:5432/fiscus
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?set APP_DATABASE_PASSWORD in .env}
      # The worker's own role, the only one system context works for (#271). Defaults to the app's
      # password: what keeps the api out of system context is the role, not the password.
      WORKER_DATABASE_PASSWORD: ${WORKER_DATABASE_PASSWORD:-${APP_DATABASE_PASSWORD}}
      # Set only to rotate the master key: enables the fiscus_maintenance login rotate-key uses.
      MAINTENANCE_DATABASE_PASSWORD: ${MAINTENANCE_DATABASE_PASSWORD:-}
      # A pg_dump before each upgrade that has migrations to apply; the last 5 are kept.
      MIGRATE_BACKUP: ${MIGRATE_BACKUP:-true}
      MIGRATE_BACKUP_KEEP: ${MIGRATE_BACKUP_KEEP:-5}
      # age public keys the dumps are encrypted to (docs/security/backups.md). Unset: unencrypted.
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Only this image mounts it, so the volume takes its /backups ownership (node).
      - db-backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # A database dump every day, the last 7 kept, encrypted to BACKUP_AGE_RECIPIENTS
  # (docs/security/backups.md). Copy the volume's .age files off the server: they're safe to.
  backup:
    image: ghcr.io/ahanel13/fiscus-api:${FISCUS_VERSION:-latest}
    build:
      <<: *build-args
      dockerfile: apps/api/Dockerfile
    command: ['node_modules/.bin/fiscus-backup']
    restart: unless-stopped
    # The image's check is the api's; this one serves nothing, and logs each backup.
    healthcheck:
      disable: true
    environment:
      MIGRATION_DATABASE_URL: postgres://fiscus_owner:${POSTGRES_PASSWORD}@db:5432/fiscus
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - db-backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: ghcr.io/ahanel13/fiscus-api:${FISCUS_VERSION:-latest}
    build:
      <<: *build-args
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: &service-env
        DATABASE_URL: postgres://fiscus_app:${APP_DATABASE_PASSWORD}@db:5432/fiscus
        APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
        APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-1}
        # Only while rotating the master key (docs/security/encryption.md): the key being replaced.
        APP_ENCRYPTION_KEY_PREVIOUS: ${APP_ENCRYPTION_KEY_PREVIOUS:-}
        APP_ENCRYPTION_KEY_PREVIOUS_VERSION: ${APP_ENCRYPTION_KEY_PREVIOUS_VERSION:-}
        LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${FISCUS_PUBLIC_URL:-http://localhost:8080}
      SIGNUP_MODE: ${FISCUS_SIGNUP_MODE:-invite_only}
      COOKIE_SECURE: ${FISCUS_COOKIE_SECURE:-true}
      # The api is only reachable through the web container's proxy, so its X-Forwarded-For is trusted.
      TRUST_PROXY: 'true'
    depends_on: &after-migrate
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  worker:
    image: ghcr.io/ahanel13/fiscus-worker:${FISCUS_VERSION:-latest}
    build:
      <<: *build-args
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      DATABASE_URL: postgres://fiscus_worker:${WORKER_DATABASE_PASSWORD:-${APP_DATABASE_PASSWORD}}@db:5432/fiscus
    depends_on: *after-migrate

  web:
    image: ghcr.io/ahanel13/fiscus-web:${FISCUS_VERSION:-latest}
    build:
      <<: *build-args
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
      API_URL: ''
      SOURCE_URL: ${FISCUS_SOURCE_URL:-}
    ports:
      - '${FISCUS_BIND:-127.0.0.1}:${FISCUS_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

  # Master key rotation, run by hand (docs/security/encryption.md):
  #   docker compose --profile maintenance run --rm rotate-key [--check]
  rotate-key:
    image: ghcr.io/ahanel13/fiscus-api:${FISCUS_VERSION:-latest}
    build:
      <<: *build-args
      dockerfile: apps/api/Dockerfile
    # An entrypoint, so `run --rm rotate-key --check` passes --check to it.
    entrypoint: ['node_modules/.bin/fiscus-rotate-key']
    profiles: [maintenance]
    restart: 'no'
    healthcheck:
      disable: true
    environment:
      MAINTENANCE_DATABASE_URL: postgres://fiscus_maintenance:${MAINTENANCE_DATABASE_PASSWORD:-}@db:5432/fiscus
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-1}
      APP_ENCRYPTION_KEY_PREVIOUS: ${APP_ENCRYPTION_KEY_PREVIOUS:-}
      APP_ENCRYPTION_KEY_PREVIOUS_VERSION: ${APP_ENCRYPTION_KEY_PREVIOUS_VERSION:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # MCP server over stdio: `docker compose --profile mcp run --rm -i mcp`
  mcp:
    image: ghcr.io/ahanel13/fiscus-mcp:${FISCUS_VERSION:-latest}
    build:
      <<: *build-args
      dockerfile: apps/mcp/Dockerfile
    profiles: [mcp]
    stdin_open: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  db-data:
  # Database dumps: before each upgrade (docs/design/upgrades.md §5) and daily
  # (docs/security/backups.md). Back up APP_ENCRYPTION_KEY separately.
  db-backups:
  # Receipt storage (local-disk driver) is added with M9.
