name: Epic
description: A feature area composed of multiple issues
title: "epic: "
labels: ["type:epic"]
body:
  - type: textarea
    id: goal
    attributes: { label: Goal, description: What outcome does this epic deliver? }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: In scope / out of scope }
  - type: textarea
    id: issues
    attributes: { label: Child issues, placeholder: "- [ ] #" }
