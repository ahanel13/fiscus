name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Commits are signed off (DCO)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Each commit certifies the Developer Certificate of Origin (ADR 0007, CONTRIBUTING.md).
      - run: scripts/check-dco.sh "origin/${{ github.base_ref }}" HEAD
