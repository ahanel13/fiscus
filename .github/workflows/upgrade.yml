name: Upgrade path

# Upgrading from the previous release (docs/design/upgrades.md §8), when migrations change: the
# upgraded schema matches a fresh install, and the previous release's api tests pass on it.
on:
  pull_request:
    paths:
      - packages/db/migrations/**
      - packages/db/src/migrate.ts
      - packages/db/src/upgrade.test.ts
      - scripts/upgrade-check.sh
      - .github/workflows/upgrade.yml
  push:
    branches: [main]
    paths:
      - packages/db/migrations/**
      - packages/db/src/migrate.ts
  workflow_dispatch:

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  upgrade:
    name: Upgrade from the previous release (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [schema, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release tags

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@fiscus/db...
      - run: scripts/upgrade-check.sh ${{ matrix.check }}
