name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; Dependabot (#13) keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migration check compares against the base branch

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - name: Merged migrations are immutable
        if: github.event_name == 'pull_request'
        run: scripts/check-migrations.sh "origin/${{ github.base_ref }}"
      - run: pnpm format:check
      - run: pnpm spdx:check
      - run: pnpm licenses:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm env:check

  images:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, mcp, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds twice, the second time from scratch, and fails if the digests differ: images must be
      # reproducible (ADR 0014 §4). PRs check amd64; the release workflow rebuilds both platforms
      # on a second runner.
      - name: Build twice and compare
        env:
          APP: ${{ matrix.app }}
        run: |
          first=$(scripts/build-image.sh "$APP" --platform linux/amd64 --oci "$RUNNER_TEMP/first.tar")
          second=$(scripts/build-image.sh "$APP" --platform linux/amd64 --oci "$RUNNER_TEMP/second.tar" --no-cache)
          echo "first:  $first"
          echo "second: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::fiscus-$APP built differently twice. See docs/security/verify-releases.md for finding the difference."
            exit 1
          fi

  e2e:
    name: End-to-end (compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f deploy/compose/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start a fresh stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nAPP_DATABASE_PASSWORD=%s\nAPP_ENCRYPTION_KEY=%s\n' \
            "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" "$(openssl rand -base64 32)" \
            > deploy/compose/.env
          $COMPOSE up -d --build --wait
          token=$($COMPOSE logs api | grep -o 'setup token: [A-Za-z0-9_-]*' | tail -1 | cut -d' ' -f3)
          echo "::add-mask::$token"
          echo "E2E_SETUP_TOKEN=$token" >> "$GITHUB_ENV"

      - run: pnpm --filter @fiscus/web exec playwright install --with-deps chromium

      - run: pnpm --filter @fiscus/web e2e

      # On the data the e2e tests left: an encrypted backup restores to the same rows (#306).
      - name: Backup and restore drill
        run: scripts/backup-drill.sh

      # Then rotates the master key on it: re-wrapped, readable with the new key alone (#25).
      - name: Master key rotation drill
        run: scripts/rotation-drill.sh

      - name: Collect logs
        if: failure()
        run: $COMPOSE logs --no-color > compose.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            compose.log
          retention-days: 7
