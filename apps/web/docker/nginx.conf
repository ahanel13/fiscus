server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  # Runtime config written at container start by 40-fiscus-env.sh.
  location = /env.js {
    alias /tmp/fiscus-env.js;
    default_type application/javascript;
    expires -1;
  }

  # Hashed build output never changes, so it can be cached forever.
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
