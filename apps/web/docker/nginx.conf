# The path without its query string, and no referrer: a query can hold a search ("?q=Venmo Sam")
# and the referrer is the page's URL, query and all. No financial data in logs (#308).
log_format fiscus '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time "$http_user_agent"';

# Plaid Link, on the connect pages only (#79, threat model T4): its script and frame from
# cdn.plaid.com, and requests to Plaid's api, as Plaid asks of a strict policy. Every other page
# keeps the policy that allows nothing from outside this origin. The connect pages are entered and
# left with a full page load, so Plaid's script never runs under another page's URL; the OAuth
# return (/connect/plaid/oauth) is one fixed path, as Plaid matches redirect URIs exactly. Keyed on
# $request_uri, the path as requested: by the time headers are added, try_files has made $uri
# /index.html. No 'unsafe-inline' or 'unsafe-eval': Link doesn't need them (docs/security).
map $request_uri $fiscus_plaid_page {
  ~^/h/[^/?]+/connect/plaid(/|\?|$) 1;
  ~^/connect/plaid/oauth(\?|$) 1;
  default 0;
}
map $fiscus_plaid_page $fiscus_plaid_script {
  1 " https://cdn.plaid.com";
  default "";
}
map $fiscus_plaid_page $fiscus_plaid_connect {
  1 " https://sandbox.plaid.com https://production.plaid.com";
  default "";
}
map $fiscus_plaid_page $fiscus_plaid_frame {
  1 " frame-src https://cdn.plaid.com;";
  default "";
}

server {
  listen 8080;
  access_log /var/log/nginx/access.log fiscus;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Sets $fiscus_api_origin: API_URL's origin when the API is on another one, or nothing.
  # Written at container start by 40-fiscus-env.sh.
  include /tmp/fiscus-csp.conf;

  # On every response, errors included ("always"). A location that adds its own header loses
  # these, so none does.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  # Scripts, styles, and fonts from this origin only, so an escaping bug can't run injected
  # script (threat model T4, #378). The runtime config (/env.js) and the pre-paint theme
  # (/theme.js) are files for that reason; nothing is inline. Requests go to this origin, plus
  # API_URL's when the API is elsewhere. On the connect pages only, Plaid Link's script, frame
  # and api (the maps above). One header line, so no location ever drops the others.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'$fiscus_plaid_script; style-src 'self'; connect-src 'self'$fiscus_api_origin$fiscus_plaid_connect;$fiscus_plaid_frame frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
  # Hardware and APIs the app doesn't use. Camera comes back with receipts (M9).
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

  # Compressed: the app and API responses are JSON and JS, which shrink 3–15x (the transfer
  # review on a large import goes from 303 KB to 19 KB), and phones often come in over a tunnel.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/problem+json application/javascript text/css image/svg+xml;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  # Optional /api/ reverse proxy, written at container start when API_UPSTREAM is set.
  include /tmp/fiscus-proxy*.conf;

  # Runtime config written at container start by 40-fiscus-env.sh.
  location = /env.js {
    alias /tmp/fiscus-env.js;
    default_type application/javascript;
    expires -1;
  }

  # Hashed build output never changes, so it can be cached forever.
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
