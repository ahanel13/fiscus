<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review recurring (phone) · prototype</title>
    <link rel="stylesheet" href="prototype.css" />
  </head>
  <body>
    <div class="phone">
      <div class="topbar"><span>‹ Review recurring</span><span class="muted">3 of 8</span></div>
      <div class="content stack">
        <div class="card stack">
          <div class="row">
            <div class="logo" style="background: #c98a12">L</div>
            <div class="grow">
              <b style="font-size: 16px">Lakeside Power</b>
              <div class="small muted">Everyday checking</div>
            </div>
          </div>
          <div class="big">$96–$148</div>
          <div class="muted">
            Monthly, around the 24th. Seen 22 times; it varies with the season.
          </div>
          <div class="hist" style="grid-template-columns: repeat(10, 1fr)">
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 100%"></i></div>
            </div>
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 94%"></i></div>
            </div>
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 80%"></i></div>
            </div>
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 68%"></i></div>
            </div>
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 65%"></i></div>
            </div>
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 74%"></i></div>
            </div>
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 86%"></i></div>
            </div>
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 90%"></i></div>
            </div>
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 76%"></i></div>
            </div>
            <div>
              <div class="cols2" style="height: 48px"><i class="s" style="height: 70%"></i></div>
            </div>
          </div>
          <label class="field"><span>What it is</span><span class="select">Bill</span></label>
          <label class="field"
            ><span>Who looks after it</span><span class="select">Sam</span></label
          >
        </div>
        <div class="grid2" style="gap: 8px">
          <span class="btn secondary" style="justify-content: center">Not recurring</span>
          <span class="btn" style="justify-content: center">Confirm</span>
        </div>
        <div class="small muted" style="text-align: center">
          Then the next one. Skip for now with ›
        </div>
      </div>
      <div class="tabs">
        <div class="">Dashboard</div>
        <div class="">Transactions</div>
        <div class="">Budget</div>
        <div class="">Accounts</div>
        <div class="on">More</div>
      </div>
    </div>
    <div class="proto">Prototype (#340), not the built app</div>
  </body>
</html>
